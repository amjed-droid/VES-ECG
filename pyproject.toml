[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ves-ecg"
version = "2.0.0"
authors = [
  { name="Ahmed Sattar Jabbar", email="ahmed.state.me@gmail.com" },
]
description = "Official Python implementation of VES-ECG: Scale-Invariant Heteroscedastic Variance Stabilization for Real-Time Cardiac Signal Quality Assessment and Artifact Vetting. Submitted to Biomedical Signal Processing and Control (Elsevier)."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scikit-learn>=1.0"
]

[project.urls]
"Homepage" = "https://github.com/amjed-droid/VESTA"
"Bug Tracker" = "https://github.com/amjed-droid/VESTA/issues"
